<div class="min-h-[70vh] flex items-center justify-center px-4 py-8">
  <div class="mc-card max-w-md w-full p-8 shadow-lg border border-[var(--mc-line)] bg-white rounded-xl">
    <!-- Brand / Eyebrow -->
    <div class="text-center mb-6">
      <h1 class="mc-display text-2xl font-serif font-bold tracking-tight" style="color: var(--mc-oxblood-dark)">
        SanctionsLens
      </h1>
      <p class="text-xs text-gray-500 mt-1">
        Sign in to access compliance surveillance &amp; screening pipelines
      </p>
    </div>

    <!-- Inline Error Message -->
    @if (errorMessage()) {
      <div
        class="p-3 mb-5 rounded-lg border text-xs font-semibold flex items-center gap-2 bg-[#FFF4F4] text-[#A81D24] border-[#F5C2C7]"
        role="alert"
        aria-live="polite"
      >
        <svg class="w-4 h-4 shrink-0 text-[#A81D24]" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Sign In Form (Bound to Enter key via ngSubmit) -->
    <form (ngSubmit)="onLogin()" #loginForm="ngForm" class="space-y-4" novalidate>
      <div>
        <label for="username" class="mc-label text-xs font-semibold block mb-1">
          Username
        </label>
        <input
          id="username"
          name="username"
          type="text"
          [(ngModel)]="username"
          (input)="clearError()"
          class="mc-input w-full px-3 py-2 text-sm"
          placeholder="Enter username"
          required
          autocomplete="username"
          autofocus
        />
      </div>

      <div>
        <label for="password" class="mc-label text-xs font-semibold block mb-1">
          Password
        </label>
        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          (input)="clearError()"
          class="mc-input w-full px-3 py-2 text-sm"
          placeholder="Enter password"
          required
          autocomplete="current-password"
        />
      </div>

      <div class="pt-2">
        <button
          type="submit"
          class="mc-btn w-full justify-center py-2.5 cursor-pointer text-sm font-semibold transition-all"
        >
          <span>Sign In</span>
          <span class="arr">&rarr;</span>
        </button>
      </div>
    </form>
  </div>
</div>
